name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID（留空使用默认 com.hongguofree.app）'
        required: false
        default: ''
      export_method:
        description: '签名方式（仅在配置了证书 secrets 时生效）'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - enterprise
          - app-store
      marketing_version:
        description: '版本号（留空用 project.yml 的 1.0.0）'
        required: false
        default: ''
      build_number:
        description: '构建号（留空用 run number）'
        required: false
        default: ''
      publish_release:
        description: '构建完成后发布到 Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SCHEME: HongGuoFree
      PROJECT: HongGuoFree.xcodeproj
      BUNDLE_ID: ${{ inputs.bundle_id || 'com.hongguofree.app' }}
      EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
      MARKETING_VERSION: ${{ inputs.marketing_version || '1.0.0' }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
      # 是否发布到 Releases：
      #   push tag v*        -> 是
      #   手动触发          -> 看 publish_release
      #   push 分支 / PR    -> 否
      SHOULD_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Install XcodeGen
        run: |
          # 钉版本：新版会生成 objectVersion 77 的工程，低版本 Xcode 打不开
          brew install xcodegen
          xcodegen --version
          echo "Xcode: $(xcodebuild -version | head -1)"

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project "$PROJECT"

      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Verify .app
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/$SCHEME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::找不到 $APP_PATH"
            ls -R build/DerivedData/Build/Products || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          file "$APP_PATH/$SCHEME" || true
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload build/unsigned
          mkdir -p build/Payload build/unsigned
          cp -R "$APP_PATH" build/Payload/
          # 未签名包需要清掉签名残留，否则部分安装器会报错
          rm -rf "build/Payload/$SCHEME.app/_CodeSignature" || true
          IPA_NAME="HongGuoFree-${MARKETING_VERSION}-${BUILD_NUMBER}-unsigned.ipa"
          (cd build && /usr/bin/zip -qry "unsigned/$IPA_NAME" Payload)
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh build/unsigned

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoFree-unsigned-ipa
          path: build/unsigned/*.ipa
          if-no-files-found: error
          retention-days: 30

      # ---------- 以下步骤仅在配置了签名 secrets 时执行 ----------

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 -D -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist" || true

      - name: Re-sign IPA
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          IDENTITY="${SIGNING_IDENTITY:-}"
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db" | head -1 | sed -E 's/.*"(.*)"/\1/')
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::没有找到可用的代码签名证书"
            exit 1
          fi
          echo "使用证书：$IDENTITY"

          APP_DIR="build/Payload/$SCHEME.app"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP_DIR/embedded.mobileprovision"
          rm -rf "$APP_DIR/_CodeSignature"

          /usr/bin/codesign --force --sign "$IDENTITY" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --timestamp=none \
            --generate-entitlement-der \
            "$APP_DIR"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          /usr/bin/codesign -d --entitlements :- "$APP_DIR" || true

          mkdir -p build/signed
          (cd build && /usr/bin/zip -qry "signed/HongGuoFree-signed.ipa" Payload)
          ls -lh build/signed

      - name: Upload signed IPA
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoFree-signed-ipa
          path: build/signed/*.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/xcodebuild.log
            build/DerivedData/Logs/**/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 发布到 GitHub Releases ----------

      - name: Prepare release metadata
        if: env.SHOULD_RELEASE == 'true'
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="$TAG"
          else
            TAG="v${MARKETING_VERSION}-${BUILD_NUMBER}"
            TITLE="v${MARKETING_VERSION} (${BUILD_NUMBER})"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "release tag: $TAG"

      - name: Collect release assets
        if: env.SHOULD_RELEASE == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/release
          cp build/unsigned/*.ipa build/release/ || true
          if [ -d build/signed ] && ls build/signed/*.ipa >/dev/null 2>&1; then
            cp build/signed/*.ipa build/release/ || true
          fi
          # 附带安装说明
          cat > build/release/INSTALL.txt <<'EOF'
          红果免广告 · iOS 安装说明
          ================================

          本包未签名，需自行签名后安装。

          方式一：Sideloadly（Windows / macOS）
            1. 下载 Sideloadly
            2. 连上 iPhone，把 ipa 拖进去
            3. 填入 Apple ID，点 Start
            4. 手机「设置 → 通用 → VPN与设备管理」信任开发者

          方式二：AltStore
            1. 电脑装 AltStore，手机装 AltStore App
            2. 用 AltStore 打开 ipa 安装
            3. 每 7 天需要在 AltStore 里刷新一次

          方式三：爱思助手（Windows）
            工具箱 → IPA 签名 → 导入 ipa → 签名后安装

          首次启动后
            1. 打开「我的 → 解析服务」
            2. 填入你的服务器地址（如 http://192.168.1.10:8787）
            3. 点「测试连接」，显示「连接正常」即可
            4. 回首页下拉刷新，开始看剧

          自建解析服务
            node server/hongguo-server.mjs
            详见仓库 server/README.md
          EOF
          ls -lh build/release

      - name: Publish to Releases
        if: env.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_TITLE }}
          files: build/release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## 红果免广告 ${{ env.TAG }}

            **未签名 IPA**，需用 Sideloadly / AltStore / 爱思助手自签安装。

            ### 这个版本包含
            - 真实红果剧库（推荐 / 热播 / 榜单 / 新剧，支持下拉瀑布流）
            - 全集 1080P 直连播放（服务端解密 CENC）
            - 弹幕（真实红果弹幕，可调位置/字号/速度/透明度）
            - 观看历史 + 续播 + 收藏
            - 播放器：双击跳转、横向拖进度、纵向调亮度/音量、长按 2 倍速

            ### 安装前需要
            自建解析服务（仓库 `server/` 目录）：
            ```bash
            node server/hongguo-server.mjs
            ```
            装好后在「我的 → 解析服务」填服务器地址。

            ### 构建信息
            - Bundle ID: `${{ env.BUNDLE_ID }}`
            - 版本: `${{ env.MARKETING_VERSION }} (${{ env.BUILD_NUMBER }})`
            - 签名状态: ${{ env.HAS_SIGNING == 'true' && '已签名' || '未签名' }}

            ---
            仅供个人学习与技术研究，内容版权归原权利人所有。

      - name: Summary
        if: always()
        run: |
          {
            echo "### 构建完成"
            echo ""
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- 版本: \`$MARKETING_VERSION ($BUILD_NUMBER)\`"
            echo "- 未签名 IPA: \`$IPA_NAME\`（用 Sideloadly / AltStore / 爱思助手 自签安装）"
            if [ "$HAS_SIGNING" = "true" ]; then
              echo "- 已签名 IPA: \`HongGuoFree-signed.ipa\`（可直接安装）"
            else
              echo "- 已签名 IPA: 未生成（未配置 \`BUILD_CERTIFICATE_BASE64\` / \`PROVISIONING_PROFILE_BASE64\`）"
            fi
            echo ""
            echo "在本次运行页面底部的 **Artifacts** 区域下载。"
            if [ "$SHOULD_RELEASE" = "true" ]; then
              echo ""
              echo "### 已发布到 Releases"
              echo ""
              echo "标签 \`$TAG\` — https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
              echo ""
              echo "用户可直接从 Releases 页面下载 ipa。"
            else
              echo ""
              echo "> 本次未发布到 Releases（分支推送 / PR）。"
              echo "> 发布方式：推送 \`v*\` 标签，或在手动触发时勾选 \`publish_release\`。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
