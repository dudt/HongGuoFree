name: HongGuoFree
options:
  bundleIdPrefix: com.hongguofree
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.35.0"
  # 钉住工程文件格式：新版 XcodeGen 默认 projectFormat=xcode16_0
  # 会写出 objectVersion 77，Xcode 15 打不开（CI 表现为 exit 74）。
  projectFormat: xcode15_0

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  HongGuoFree:
    type: application
    platform: iOS
    sources:
      - path: HongGuoFree
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: HongGuoFree/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hongguofree.app
        PRODUCT_NAME: HongGuoFree
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: "HongGuoFree/Bridging-Header.h"
        GENERATE_INFOPLIST_FILE: "NO"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

schemes:
  HongGuoFree:
    build:
      targets:
        HongGuoFree: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
